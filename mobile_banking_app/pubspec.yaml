name: mobile_banking_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  dio: ^5.11.0
  get: ^4.7.3
  get_storage: ^2.1.1
  image_picker: ^1.2.2
  fluentui_system_icons: ^1.1.273

  # Camera
  camera: ^0.11.2

  # Google ML Kit
  google_mlkit_face_detection: ^0.13.1

  # Permission
  permission_handler: ^12.0.1
  google_fonts: ^8.1.0
  intl: ^0.19.0


  cupertino_icons: ^1.0.2
  http: ^1.2.0
  http_parser: ^4.1.0
  carousel_slider: ^5.1.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^20.1.0
  reorderable_grid_view: ^2.2.8
  fl_chart: ^1.0.0
  gal: ^2.3.3
  share_plus: ^12.0.2
  path_provider: ^2.1.5
  social_sharing_plus: ^1.2.3


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "lib/app/assets/images/logo.png"
  min_sdk_android: 21
flutter:
  uses-material-design: true

  assets:
    - lib/app/assets/images/
